openapi: 3.0.3
info:
  title: Fit App Activity Tracking API
  version: 1.0.0
  description: API for logging activities
servers:
  - url: https://{host}
    variables:
      host:
        default: example.azurestaticapps.net
paths:
  /activities:
    get:
      summary: List activities
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [Running, Rowing, Rucking]
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
          default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activity'
    post:
      summary: Create activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          description: Validation error
  /activities/{id}:
    put:
      summary: Update activity
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '404':
          description: Not found
    delete:
      summary: Delete activity
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
components:
  schemas:
    Activity:
      type: object
      required: [id, type, duration, avgBpm, date]
      properties:
        id:
            type: string
        type:
            type: string
            enum: [Running, Rowing, Rucking]
        duration:
            type: number
            minimum: 0.1
        distance:
            type: number
            minimum: 0.1
            nullable: true
        avgBpm:
          type: integer
          minimum: 20
          maximum: 240
        comments:
            type: string
            nullable: true
        date:
            type: string
            format: date
        createdAt:
            type: string
            format: date-time
        updatedAt:
            type: string
            format: date-time
    ActivityCreate:
      type: object
      required: [type, duration, avgBpm]
      properties:
        type:
            type: string
            enum: [Running, Rowing, Rucking]
        duration:
            type: number
            minimum: 0.1
        distance:
            type: number
            minimum: 0.1
            nullable: true
        avgBpm:
          type: integer
          minimum: 20
          maximum: 240
        comments:
            type: string
            nullable: true
        date:
            type: string
            format: date
    ActivityUpdate:
      type: object
      properties:
        duration:
            type: number
            minimum: 0.1
        distance:
            type: number
            minimum: 0.1
            nullable: true
        avgBpm:
            type: integer
            minimum: 20
            maximum: 240
            nullable: true
        comments:
            type: string
            nullable: true
        date:
            type: string
            format: date
