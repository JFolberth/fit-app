<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Activity History | FitApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../components/styles.css" />
  <script>
    window.FITAPP_API_URL = "https://fitapp-dev-func.azurewebsites.net/api";
  </script>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="../index.html" class="navbar-brand">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
          <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
          <line x1="6" y1="1" x2="6" y2="4"></line>
          <line x1="10" y1="1" x2="10" y2="4"></line>
          <line x1="14" y1="1" x2="14" y2="4"></line>
        </svg>
        FitApp
      </a>
      <div class="navbar-links">
        <a href="log-activity.html" class="nav-link">Log Activity</a>
        <a href="history.html" class="nav-link active">History</a>
      </div>
    </div>
  </nav>

  <main>
    <header class="page-header">
      <h1 class="page-title">Activity History</h1>
      <p class="page-subtitle">Review your past workouts and track your progress</p>
    </header>

    <div id="notices"></div>

    <div id="filter" class="filter-bar"></div>

    <div id="loading" class="loading" style="display: none;">
      <div class="spinner"></div>
    </div>

    <ul id="list" class="activity-list"></ul>

    <div id="empty" class="empty-state" style="display: none;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <p>No activities found. Start by logging your first workout!</p>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
      <div class="modal">
        <div class="modal-header">
          <h2 id="edit-modal-title" class="modal-title">Edit Activity</h2>
          <button type="button" class="modal-close" aria-label="Close" id="edit-modal-close">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <form id="edit-form">
          <div class="modal-body">
            <input type="hidden" id="edit-id" />
            <div class="form-grid">
              <div class="form-group">
                <label class="form-label" for="edit-type">Activity Type</label>
                <select id="edit-type" class="form-select" required>
                  <option value="Running">Running</option>
                  <option value="Rowing">Rowing</option>
                  <option value="Rucking">Rucking</option>
                </select>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="edit-duration">Duration (min)</label>
                  <input type="number" id="edit-duration" class="form-input" step="0.1" min="0.1" required />
                </div>
                <div class="form-group" id="edit-distance-group">
                  <label class="form-label" for="edit-distance">Distance (miles)</label>
                  <input type="number" id="edit-distance" class="form-input" step="0.1" min="0.1" />
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="edit-avgBpm">Avg Heart Rate (BPM)</label>
                  <input type="number" id="edit-avgBpm" class="form-input" min="20" max="240" required />
                </div>
                <div class="form-group">
                  <label class="form-label" for="edit-date">Date</label>
                  <input type="date" id="edit-date" class="form-input" required />
                </div>
              </div>
              <div class="form-group full-width">
                <label class="form-label" for="edit-comments">Comments (optional)</label>
                <textarea id="edit-comments" class="form-textarea form-input" rows="3" maxlength="1000"></textarea>
              </div>
            </div>
            <div id="edit-error" class="notice error hidden"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="edit-cancel">Cancel</button>
            <button type="submit" class="btn btn-primary" id="edit-save">Save Changes</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Delete Confirmation Dialog -->
    <div id="delete-dialog" class="modal-overlay hidden" role="alertdialog" aria-modal="true" aria-labelledby="delete-dialog-title" aria-describedby="delete-dialog-message">
      <div class="dialog">
        <div class="dialog-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
          </svg>
        </div>
        <h2 id="delete-dialog-title" class="dialog-title">Delete Activity?</h2>
        <p id="delete-dialog-message" class="dialog-message">This action cannot be undone. The activity will be permanently removed from your history.</p>
        <input type="hidden" id="delete-id" />
        <div class="dialog-actions">
          <button type="button" class="btn btn-secondary" id="delete-cancel">Cancel</button>
          <button type="button" class="btn btn-danger" id="delete-confirm">Delete</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { listActivities, updateActivity, deleteActivity } from '../services/api.js';

    import { Notification } from '../components/Notification.js';
    import { TypeFilter } from '../components/TypeFilter.js';

    const notices = new Notification(document.getElementById('notices'));
    const filter = new TypeFilter(document.getElementById('filter'));
    const list = document.getElementById('list');
    const loading = document.getElementById('loading');
    const empty = document.getElementById('empty');

    // Edit modal elements
    const editModal = document.getElementById('edit-modal');
    const editForm = document.getElementById('edit-form');
    const editId = document.getElementById('edit-id');
    const editType = document.getElementById('edit-type');
    const editDuration = document.getElementById('edit-duration');
    const editDistance = document.getElementById('edit-distance');
    const editDistanceGroup = document.getElementById('edit-distance-group');
    const editAvgBpm = document.getElementById('edit-avgBpm');
    const editDate = document.getElementById('edit-date');
    const editComments = document.getElementById('edit-comments');
    const editError = document.getElementById('edit-error');
    const editSaveBtn = document.getElementById('edit-save');

    // Delete dialog elements
    const deleteDialog = document.getElementById('delete-dialog');
    const deleteId = document.getElementById('delete-id');
    const deleteConfirmBtn = document.getElementById('delete-confirm');

    // Current filter state
    let currentTypeFilter = null;

    const typeIcons = {
      Running: '🏃',
      Rowing: '🚣',
      Rucking: '🎒'
    };

    function formatDate(dateStr) {
      const date = new Date(dateStr + 'T00:00:00');
      return date.toLocaleDateString('en-US', { 
        weekday: 'short', 
        month: 'short', 
        day: 'numeric' 
      });
    }

    // Toggle distance field based on activity type
    function updateDistanceVisibility(type) {
      if (type === 'Rowing') {
        editDistanceGroup.style.display = 'none';
        editDistance.removeAttribute('required');
        editDistance.value = '';
      } else {
        editDistanceGroup.style.display = 'block';
        editDistance.setAttribute('required', 'required');
      }
    }

    // Open edit modal with activity data
    function openEditModal(activity) {
      editId.value = activity.id;
      editType.value = activity.type;
      editDuration.value = activity.duration;
      editDistance.value = activity.distance || '';
      editAvgBpm.value = activity.avgBpm || '';
      editDate.value = activity.date;
      editComments.value = activity.comments || '';
      editError.classList.add('hidden');
      editError.textContent = '';
      
      updateDistanceVisibility(activity.type);
      
      editModal.classList.remove('hidden');
      editType.focus();
      
      // Trap focus in modal
      document.body.style.overflow = 'hidden';
    }

    // Close edit modal
    function closeEditModal() {
      editModal.classList.add('hidden');
      document.body.style.overflow = '';
      editForm.reset();
    }

    // Open delete confirmation dialog
    function openDeleteDialog(activityId) {
      deleteId.value = activityId;
      deleteDialog.classList.remove('hidden');
      deleteConfirmBtn.focus();
      document.body.style.overflow = 'hidden';
    }

    // Close delete dialog
    function closeDeleteDialog() {
      deleteDialog.classList.add('hidden');
      document.body.style.overflow = '';
    }

    // Handle edit form submission
    async function handleEditSubmit(e) {
      e.preventDefault();
      
      const id = editId.value;
      const payload = {
        type: editType.value,
        duration: parseFloat(editDuration.value),
        avgBpm: parseInt(editAvgBpm.value, 10),
        date: editDate.value,
        comments: editComments.value || null
      };
      
      // Include distance only for Running and Rucking
      if (editType.value !== 'Rowing' && editDistance.value) {
        payload.distance = parseFloat(editDistance.value);
      } else {
        payload.distance = null;
      }

      editSaveBtn.disabled = true;
      editSaveBtn.textContent = 'Saving...';
      editError.classList.add('hidden');

      try {
        await updateActivity(id, payload);
        closeEditModal();
        notices.show('success', 'Activity updated successfully!');
        load(currentTypeFilter);
      } catch (err) {
        editError.textContent = err.message || 'Failed to update activity';
        editError.classList.remove('hidden');
      } finally {
        editSaveBtn.disabled = false;
        editSaveBtn.textContent = 'Save Changes';
      }
    }

    // Handle delete confirmation
    async function handleDeleteConfirm() {
      const id = deleteId.value;
      
      deleteConfirmBtn.disabled = true;
      deleteConfirmBtn.textContent = 'Deleting...';

      try {
        await deleteActivity(id);
        closeDeleteDialog();
        notices.show('success', 'Activity deleted successfully!');
        load(currentTypeFilter);
      } catch (err) {
        closeDeleteDialog();
        notices.show('error', err.message || 'Failed to delete activity');
      } finally {
        deleteConfirmBtn.disabled = false;
        deleteConfirmBtn.textContent = 'Delete';
      }
    }

    // Event listeners for edit modal
    editType.addEventListener('change', () => updateDistanceVisibility(editType.value));
    editForm.addEventListener('submit', handleEditSubmit);
    document.getElementById('edit-modal-close').addEventListener('click', closeEditModal);
    document.getElementById('edit-cancel').addEventListener('click', closeEditModal);

    // Event listeners for delete dialog
    document.getElementById('delete-cancel').addEventListener('click', closeDeleteDialog);
    deleteConfirmBtn.addEventListener('click', handleDeleteConfirm);

    // Close modals on overlay click
    editModal.addEventListener('click', (e) => {
      if (e.target === editModal) closeEditModal();
    });
    deleteDialog.addEventListener('click', (e) => {
      if (e.target === deleteDialog) closeDeleteDialog();
    });

    // Close modals on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (!editModal.classList.contains('hidden')) closeEditModal();
        if (!deleteDialog.classList.contains('hidden')) closeDeleteDialog();
      }
    });

    async function load(type) {
      currentTypeFilter = type;
      loading.style.display = 'flex';
      list.innerHTML = '';
      empty.style.display = 'none';
      
      try {
        const items = await listActivities(type, 50);
        loading.style.display = 'none';
        
        if (items.length === 0) {
          empty.style.display = 'block';
          return;
        }

        for (const i of items) {
          const li = document.createElement('li');
          li.className = 'activity-item';
          li.dataset.activityId = i.id;
          
          const icon = typeIcons[i.type] || '🏋️';
          const typeClass = i.type.toLowerCase();
          const distText = i.distance != null ? `${i.distance}` : '—';
          const bpmText = i.avgBpm != null ? `${i.avgBpm}` : '—';
          
          li.innerHTML = `
            <div class="activity-header">
              <span class="activity-type">
                <span class="activity-type-badge ${typeClass}">${icon}</span>
                ${i.type}
              </span>
              <span class="activity-date">${formatDate(i.date)}</span>
              <div class="activity-actions">
                <button type="button" class="action-btn edit" aria-label="Edit activity" data-action="edit">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                  </svg>
                </button>
                <button type="button" class="action-btn delete" aria-label="Delete activity" data-action="delete">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                  </svg>
                </button>
              </div>
            </div>
            <div class="activity-stats">
              <div class="activity-stat">
                <span class="activity-stat-value">${i.duration}</span>
                <span class="activity-stat-label">Minutes</span>
              </div>
              <div class="activity-stat">
                <span class="activity-stat-value">${distText}</span>
                <span class="activity-stat-label">Miles</span>
              </div>
              <div class="activity-stat">
                <span class="activity-stat-value">${bpmText}</span>
                <span class="activity-stat-label">Avg BPM</span>
              </div>
            </div>
          `;
          
          // Store activity data for edit
          li._activityData = i;
          
          list.appendChild(li);
        }
      } catch (err) {
        loading.style.display = 'none';
        notices.show('error', err.message || 'Failed to load activities');
      }
    }

    // Delegate click events for action buttons
    list.addEventListener('click', (e) => {
      const actionBtn = e.target.closest('.action-btn');
      if (!actionBtn) return;
      
      const li = actionBtn.closest('.activity-item');
      const activity = li._activityData;
      
      if (actionBtn.dataset.action === 'edit') {
        openEditModal(activity);
      } else if (actionBtn.dataset.action === 'delete') {
        openDeleteDialog(activity.id);
      }
    });

    document.getElementById('filter').addEventListener('filterchange', (e) => {
      load(e.detail.type);
    });

    load(null);
  </script>
</body>
</html>
