name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install bandit pip-audit

      - name: Run unit/integration tests
        working-directory: backend
        run: |
          pytest --maxfail=1 --disable-warnings -q

      - name: Security scan (bandit)
        run: bandit -r backend -q || true

      - name: Security scan (pip-audit)
        run: pip-audit || true

  functional-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts'
      - name: Install Playwright and static server
        run: |
          npm install -D @playwright/test http-server wait-on
          npx playwright install --with-deps
      - name: Start static server for frontend
        run: |
          nohup npx http-server frontend/src -p 4280 >/dev/null 2>&1 &
          npx wait-on http://localhost:4280
      - name: Run functional tests
        working-directory: frontend/tests/functional
        env:
          SWA_BASE_URL: http://localhost:4280
        run: |
          npx playwright test
